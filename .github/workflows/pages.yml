name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - claude/composer-review-app-rPddn
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html app.css app.js _site/
          cp README.md _site/ 2>/dev/null || true
          # Pull the submissions CSV from main (lives there, not on app branches).
          git show origin/main:"Festival ADAR 2026_Submissions_2026-05-18.csv" \
            > _site/submissions.csv 2>/dev/null || \
            echo "no submissions.csv found on main; site will require manual upload"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
