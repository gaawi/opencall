name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - claude/composer-review-app-rPddn
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html app.css app.js _site/
          cp README.md _site/ 2>/dev/null || true

      - name: Sanitize submissions CSV from main
        run: |
          git show origin/main:"Festival ADAR 2026_Submissions_2026-05-18.csv" \
            > /tmp/raw.csv 2>/dev/null \
            || { echo "no submissions.csv found on main; skipping"; exit 0; }
          python3 - <<'PY'
          import csv
          # Columns whose names match any of these (case-insensitive) are dropped.
          DROP_SUBSTRINGS = [
              "email", "phone", "website", "tell us about", "admin fee",
              "submission pdf", "submission preview", "respondent id",
              "submitted at", "untitled multiple choice", "untitled long answer",
          ]
          def should_drop(col):
              c = col.lower()
              return any(s in c for s in DROP_SUBSTRINGS)
          with open("/tmp/raw.csv", newline="", encoding="utf-8-sig") as f, \
               open("_site/submissions.csv", "w", newline="", encoding="utf-8") as out:
              r = csv.DictReader(f)
              kept = [h for h in r.fieldnames if not should_drop(h)]
              w = csv.DictWriter(out, fieldnames=kept)
              w.writeheader()
              for row in r:
                  w.writerow({k: row.get(k, "") for k in kept})
          print("Sanitized:", len(kept), "columns kept of", len(r.fieldnames))
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
